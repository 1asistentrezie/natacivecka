<style id="css">
/* Layout (dark only, for the set): sticky slate header (date · shift · clock · location · time status), then the day's strip of rows like a call sheet. */
:root{
  --bg:#E9E6DF; --surface:#FFFFFF; --ink:#15191B; --muted:#5E676B; --line:#CFC9BE;
  --accent:#55B9BF; --on-accent:#08201F;
  --go:#2FA862; --go-bg:#E2F3E8; --late:#E5483D; --late-bg:#F8DEDA;
  --roll:#F4C631; --roll-bg:#FFF6D6; --note-bg:#F1EEE8; --on-strong:#FFFFFF;
  --blue:#4C9BEA; --blue-strong:#1D69BF; --sun:#F2A54A;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}

html[data-theme="a"]{--bg:#0D1012;--surface:#161B1E;--ink:#E8ECEA;--muted:#97A2A6;--line:#283035;--roll-bg:#2F270B;--note-bg:#1C2326;--go-bg:#12301F;--late-bg:#3A1613;color-scheme:dark;}
html[data-theme="c"]{--bg:#0A1120;--surface:#14203A;--ink:#E7EDF7;--muted:#93A3BF;--line:#26365A;--accent:#5FA8FF;--on-accent:#06172E;--roll-bg:#2F270B;--note-bg:#1C2326;--go-bg:#12301F;--late-bg:#3A1613;color-scheme:dark;}
html[data-theme="d"]{--bg:#12100D;--surface:#211C17;--ink:#F2EADF;--muted:#AE9F8E;--line:#3B3229;--accent:#D9A35B;--on-accent:#2A1A06;--roll-bg:#2F270B;--note-bg:#1C2326;--go-bg:#12301F;--late-bg:#3A1613;color-scheme:dark;}
html[data-theme="e"]{--bg:#000;--surface:#121212;--ink:#FFFFFF;--muted:#B5B5B5;--line:#3C3C3C;--accent:#3FD0D6;--on-accent:#001A1B;--roll-bg:#2F270B;--note-bg:#1C2326;--go-bg:#12301F;--late-bg:#3A1613;color-scheme:dark;}
html[data-theme="f"]{--bg:#0C1411;--surface:#15221D;--ink:#E6F0EB;--muted:#93AAA0;--line:#25382F;--accent:#5CC59A;--on-accent:#06231A;--roll-bg:#2F270B;--note-bg:#1C2326;--go-bg:#12301F;--late-bg:#3A1613;color-scheme:dark;}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thm{all:unset;cursor:pointer;border:2px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px;color:var(--ink)}
.thm.sel{border-color:#F2A54A;box-shadow:0 0 0 2px #F2A54A}
.thm .sw{display:flex;height:34px;border-radius:6px;overflow:hidden;border:1px solid rgba(0,0,0,.2)}.thm .sw i{flex:1}
/* téma „Papír“ (výchozí): světlá stránka, černé horní menu */
.bar{--bg:#15191B;--surface:#0B0D0E;--ink:#EEF1F0;--muted:#9AA4A8;--line:#2A3236;background:#0B0D0E;color:#EEF1F0;color-scheme:dark}
body::before{background:#0B0D0E!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.35}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
#app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px;max-width:1180px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* slate header */
body.ed::before{background:#000}
.bar.ed{border-top:8px solid #000}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:10px max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:stretch}
.slot{display:flex;flex-direction:column;justify-content:center;min-width:0;gap:2px}
.lab{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.s-proj{flex:0 1 120px}
.s-proj .big{font-size:18px}
.s-proj .big{white-space:normal;overflow-wrap:anywhere;text-wrap:balance}
.s-proj.tap .big::after,.s-loc.tap .loc::after,.s-shift.tap .big::after,.s-date.tap .big::after{content:" ✎";font-size:15px;color:var(--muted);font-weight:500}
.s-proj .ph{color:var(--muted);font-weight:600}
.s-date{flex:0 0 auto}
.s-loc{flex:0 1 110px}
.loc{font-weight:700;font-size:14px;overflow-wrap:anywhere;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s-shift{flex:0 0 auto;border:2px solid var(--blue);border-radius:8px;padding:4px 12px}
.s-shift .lab{color:var(--blue)}
.s-sun{flex:0 0 auto;font-variant-numeric:tabular-nums}
.sunl{display:grid;grid-template-columns:auto auto;gap:0 8px;align-items:baseline;font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.1}
.sunl i{font-style:normal;font-size:12px;letter-spacing:.1em;color:var(--sun);font-weight:600}
.s-watch{flex:0 0 auto;display:flex;align-items:center;gap:6px;min-width:0}
.sharebtn{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);display:grid;place-items:center;padding:0;flex:none}
.sharebtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.shlist{display:flex;flex-direction:column;gap:4px;max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--bg)}
.shrow{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:15px}
.shrow:hover{background:var(--surface)}
.shrow input{width:22px;height:22px;flex:none;accent-color:var(--go)}
.shrow.now{font-weight:700}
.shtext{width:100%;min-height:96px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);padding:8px 10px;font:inherit;font-size:15px;resize:vertical}
.btn.wa{background:#25D366;border-color:#25D366;color:#06210F;text-decoration:none;display:inline-flex;align-items:center;font-weight:700}
.btn.wa[aria-disabled="true"]{opacity:.45;pointer-events:none}
.watchbtn{width:44px;height:44px;border:0;border-radius:8px;background:var(--roll);color:#1E1A06;display:grid;place-items:center;padding:0}
.watchbtn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.s-watch.is-open{width:auto}
.bar.tracking .s-sun{display:none}
.s-watch.is-open .status{width:100%}
.s-watch .status{border:0;text-align:left;cursor:pointer;padding:3px 10px;gap:0;width:auto!important;min-width:118px;flex:0 0 auto}
.s-watch .status .word{font-size:22px;line-height:1}
.s-watch .status .sub{font-size:11px;line-height:1.25;white-space:nowrap;font-variant-numeric:tabular-nums}
.s-watch .status .sub b{font-weight:700}
.sunico{width:18px;height:18px;stroke:var(--sun);fill:none;stroke-width:2;stroke-linecap:round}
.status{flex:2 1 250px;border-radius:8px;padding:6px 14px;display:flex;flex-direction:column;justify-content:center;gap:1px;background:var(--note-bg);color:var(--ink);min-width:0}
.status .word{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05;letter-spacing:.04em;text-transform:uppercase}
.status .sub{font-weight:600;font-size:14px;line-height:1.25}
.lab2{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.status.ok{background:var(--go);color:var(--on-strong)}
.status.ahead{background:var(--roll);color:#1E1A06}
.watchbtn.ok{background:var(--go);color:var(--on-strong)}
.watchbtn.late{background:var(--late);color:var(--on-strong)}
.status.late{background:var(--late);color:var(--on-strong)}
.s-clock{flex:0 0 auto;align-items:flex-end;text-align:right}
.s-menu{flex:0 0 auto;display:flex;align-items:center}
.menubtn{min-height:48px;min-width:48px;border:1px solid var(--line);border-radius:8px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 10px;
  font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.12em;color:var(--muted)}
.menubtn .bars{display:flex;flex-direction:column;gap:3px}
.menubtn .bars i{display:block;width:20px;height:2px;border-radius:1px;background:var(--ink)}
.mitem{flex-shrink:0;height:auto;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:60px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px 14px}
.mitem b{font-family:var(--f-display);font-size:19px;letter-spacing:.04em}
.mitem span{font-size:14px;color:var(--muted)}
.mitem[disabled]{opacity:.45;cursor:default}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--go);flex:none}
.live.stale i{background:var(--late)}
.dayname{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.03em}
.offline{font-family:var(--f-display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--roll);border:1px solid var(--roll);border-radius:4px;padding:3px 8px}
@media (min-width:1000px){
  .bar{display:grid;grid-template-columns:auto minmax(0,.6fr) auto minmax(0,.6fr) auto auto auto auto;gap:10px 14px}
  .big{font-size:22px}
  .clock{font-size:34px}
  .clock small{font-size:21px}
  .status .word{font-size:24px}
}
.clock{font-size:38px;letter-spacing:.01em}
.clock small{font-size:24px;color:var(--muted)}

/* toolbar */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 0 10px}
.tools select{min-height:42px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 10px;max-width:100%}
.btn{min-height:42px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{border-color:var(--late);color:var(--late)}
.btn.danger.armed{background:var(--late);color:var(--on-strong)}
.save{margin-left:auto;font-size:13px;color:var(--muted);font-weight:600}
.ro{font-family:var(--f-display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:3px 8px}

/* rows */
.cols,.row{display:grid;grid-template-columns:30px 128px 100px 78px minmax(0,1fr) 82px 44px 156px;gap:0 14px;align-items:center}
.cols{padding:0 12px 6px;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-height:64px}
.row.current{outline:4px solid var(--roll);outline-offset:-2px;background:var(--roll-bg)}
.row.done{opacity:.78}
.row.moved{background:var(--late-bg);border-color:var(--late)}
.stav{min-height:52px;border:2px solid var(--line);border-radius:6px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.1;
  font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.07em;padding:4px 8px;text-align:center;color:var(--ink)}
.stav .t{font-size:14px;letter-spacing:.02em;font-variant-numeric:tabular-nums;font-weight:600}
.stav.s-none{border-style:dashed;color:var(--muted)}
.stav.s-rolling{background:var(--roll);border-color:var(--roll);color:#1E1A06}
.stav.s-done{background:var(--go);border-color:var(--go);color:var(--on-strong)}
.stav.s-moved{background:var(--late);border-color:var(--late);color:var(--on-strong);font-size:14px}
.stav.locked{opacity:.45}
.pick{min-height:64px;border:2px solid;border-radius:8px;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.06em;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pick small{font-family:var(--f-body);font-size:13px;font-weight:600;letter-spacing:0;opacity:.85}
.p-rolling{background:var(--roll);border-color:var(--roll);color:#1E1A06}
.p-done{background:var(--go);border-color:var(--go);color:var(--on-strong)}
.stav.s-partial,.p-partial{background:repeating-linear-gradient(135deg,#2FA862 0 14px,#F4C631 14px 28px)!important;border-color:#2A9A58!important;color:#10301C!important;text-shadow:0 0 4px rgba(255,255,255,.9),0 0 2px rgba(255,255,255,.9)}
.stav.s-partial .t{color:#10301C}
.row.shot.partial{box-shadow:inset 6px 0 0 #2FA862}
.cpart{color:#2A9A58}
.p-moved{background:var(--late);border-color:var(--late);color:var(--on-strong)}
.pick.sel{outline:3px solid var(--ink);outline-offset:2px}
.memo2{color:var(--muted);margin-top:-8px}
.hint{font-size:13px;color:var(--muted);margin-top:-6px}
.fnrow{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:6px;background:var(--bg);overflow:hidden}
.fnrow input{flex:1 1 auto;min-width:0;border:0!important;border-radius:0!important;background:transparent!important}
.fnrow .ext{display:flex;align-items:center;padding:0 12px;color:var(--muted);font-weight:600;border-left:1px solid var(--line)}
.row.note{grid-template-columns:30px minmax(128px,max-content) minmax(0,1fr) 64px 156px;background:var(--note-bg);border-style:dashed;min-height:46px;padding-block:6px}
.mv{grid-area:mv;display:flex;flex-direction:column;gap:4px;align-self:center}
.mv button{width:40px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);display:grid;place-items:center;padding:0}
.mv button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.mv button[disabled]{opacity:.3;cursor:default}
.row.flash{box-shadow:0 0 0 2px var(--accent)}
.donebar{list-style:none}
.donebtn{width:100%;min-height:40px;border:1px dashed var(--line);border-radius:6px;background:transparent;color:var(--muted);display:flex;align-items:center;gap:8px;padding:4px 12px;text-align:left;font-weight:600;font-size:14px}
.donebtn b{color:var(--ink);font-family:var(--f-display);font-size:16px}
.donebtn .chev{font-size:14px;width:14px}
.donebtn .dsum{margin-left:auto;font-weight:400;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row.past{opacity:.6}
.bk{grid-area:bk;display:flex;justify-content:flex-end;align-items:center;gap:4px}
.bkbtn.lupa{color:#3F7FC4}
.bkbtn.lupa.has{color:#1F5FA8}
.bkbtn,.bkbtn.lupa,.bkbtn.has,.bkbtn.lupa.has{background:#F7F1E4;border-color:#D9CBAA}
.bkbtn{color:#7A4A1C}
.bkbtn.lupa{color:#1F5FA8}
.bkbtn{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:#B0743A;display:grid;place-items:center;padding:0}
.bkbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bkbtn.has{background:#E8DCC2;border-color:#C9B48A;color:#7A4A1C}
.bkbtn svg{stroke-width:2.3}
.row.note.alert .kind b,.row.note.alert .kind span{color:#C0150C;text-transform:uppercase;font-weight:800}
.row.note.alert{border-color:#C0150C}
.durrow{display:flex;gap:10px}
.durf{display:flex;align-items:center;gap:6px;flex:1 1 0}
.durf input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:0 10px;font-size:18px;font-variant-numeric:tabular-nums}
.durf span{color:var(--muted);font-weight:600}
.btn.blue{background:var(--blue-strong);border-color:var(--blue-strong);color:#fff;font-weight:700;min-width:120px}
.bkbtn.none{opacity:.45}
.pdfpanel{position:fixed;top:0;right:0;bottom:0;width:50vw;z-index:26;background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.35);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.mnpanel{width:100vw;border-left:0}
.bkbtn.mynote,.bkbtn.mynote.has{color:#D93025;background:#F7F1E4;border-color:#D9CBAA;opacity:1;position:relative}
.bkbtn.mynote svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.bkbtn.mynote i{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:#D93025;border:2px solid var(--surface)}
.mncols,.mnsizes{display:inline-flex;gap:5px;flex-wrap:wrap;align-items:center}
.mncol{width:28px;height:28px;border-radius:50%;border:2px solid rgba(0,0,0,.25);cursor:pointer;padding:0}
.mncol.sel{box-shadow:0 0 0 3px #F2A54A}
.mnsz{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;padding:0}
.mnsz i{display:block;border-radius:50%;background:var(--ink)}.mnsz.sel{outline:2px solid #F2A54A;outline-offset:1px}
.mnemo{display:flex;flex-wrap:wrap;gap:10px 18px;padding:8px 12px;border-bottom:1px solid var(--line);max-height:34vh;overflow:auto;background:var(--surface)}
.mnemog{display:flex;flex-direction:column;gap:2px}.mnemog>span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mnemog>div{display:flex;flex-wrap:wrap;gap:2px;max-width:420px}.mnemog button{all:unset;cursor:pointer;font-size:26px;line-height:1;padding:4px;border-radius:6px}
.mnsize{display:inline-flex;align-items:center;gap:6px}.mnsize[hidden]{display:none}.mnsize input{width:160px}.mnsize b{font-size:13px;color:var(--muted)}
.mnemog button.svgst{width:34px;height:34px;padding:3px}.mnemog button.svgst img{width:100%;height:100%;display:block}
.mnemog button.sel,.mnemog button:hover{background:rgba(242,165,74,.35)}
.annt:disabled{opacity:.4}
.mnbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line)}
.mnbar .mnc i{display:block;width:18px;height:18px;border-radius:50%}
.mnbar .annt.sel{outline:2px solid #F2A54A;outline-offset:1px}
.mnbar .mnfile{cursor:pointer;display:inline-flex;align-items:center}.mnbar .mnfinger{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.mnbar .armed{background:#E5483D;color:#fff}

/* row in progress: yellow = minutes left until the originally planned start, green frame = on plan, red = minutes past the planned end */
function paceOf(r){if(!r.origFrom||fin(r))return null;
  if(r.status!=="rolling"){var df=toMin(r.origFrom)-toMin(r.from);if(isNaN(df)||!df)return null;if(df>720)df-=1440;if(df<-720)df+=1440;return df>0?{k:"ahead",t:"+"+fmtDur(df)}:{k:"late",t:"+"+fmtDur(-df)};}
  var d=day();if(d.date&&d.date!==todayISO())return null;
  var now=nowMin(),a=toMin(r.origFrom),b=toMin(r.origTo||r.origFrom);if(a==null)return null;if(b==null)b=a;
  if(now<a)return {k:"ahead",t:"+"+fmtDur(Math.ceil(a-now))};
  if(now<=b)return {k:"ok",t:"+"+fmtDur(Math.max(0,Math.ceil(b-now)))};
  return {k:"late",t:"+"+fmtDur(Math.max(1,Math.floor(now-b)))};}
var PACE_LBL={ahead:"NÁSKOK",ok:"ON TIME",late:"ZPOŽDĚNÍ"};
function tbHTML(pc){return pc&&pc.t?'<span class="tb '+pc.k+'"><small>'+PACE_LBL[pc.k]+'</small>'+pc.t+'</span>':'';}
function paceCls(r){var pc=paceOf(r);return pc&&pc.t?' pc-'+pc.k:'';}
function paceHTML(r){return '<span class="pace" data-pace="'+r.id+'">'+tbHTML(paceOf(r))+'</span>';}
function planLine(r){return r.origFrom&&(r.origFrom!==r.from||(r.origTo||"")!==(r.to||""))?'<span class="origplan">plán '+esc(r.origFrom)+(r.origTo&&r.origTo!==r.origFrom?'–'+esc(r.origTo):'')+'</span>':'';}

  if(!roll||t==null)t=nowMin();var rows=shiftables(d,ai);if(!rows.length)return null;var dl=t-toMin(rows[0].from);if(dl>720)dl-=1440;if(dl<-720)dl+=1440;return {i:ai,delta:dl,n:rows.length,start:hm(t),roll:roll};}
function baseRows(d){return d.rows.filter(function(r){var f=r.baseFrom||(d.baseAt?r.origFrom:null);return f&&(r.from!==f||(r.to||"")!==(r.baseTo||r.origTo||""));});}
function setBase(d){d.rows.forEach(function(r){if(r.noTime||toMin(r.from)==null)return;r.origFrom=r.from;r.origTo=r.to||r.from;r.baseFrom=r.from;r.baseTo=r.to||r.from;delete r.rollMoved;});d.baseAt=nowHM();d.baseAsked=d.date||todayISO();}
function askBase(d){if(!canEdit||standalone||ui.sheet||!d||d.baseAt||!d.date||d.date!==todayISO()||d.baseAsked===d.date)return false;
  var a=toMin(d.shiftFrom),b=toMin(d.shiftTo),n=nowMin();if(a==null)return false;if(n<a)return false;if(b!=null&&b>a&&n>b)return false;return true;}
function curAnchor(d){for(var i=d.rows.length-1;i>=0;i--)if(d.rows[i].status==="rolling")return d.rows[i];return null;}
function anchorLabel(a){return a.type==="shot"?"obraz "+(a.scene||"–"):(a.kind||"poznámka");}
function placeFrom(d,place,L){L=L||0;
  if(place==="start"){var f0=d.shiftFrom||"";if(!f0)d.rows.some(function(r){if(toMin(r.from)!=null&&!r.noTime){f0=r.from;return true;}});return f0||nowHM();}
  if(place==="before"){var b=beforeRow(d);if(b&&toMin(b.from)!=null)return hm(toMin(b.from)-L);return nowHM();}
  var a=place==="cur"?curAnchor(d):null;if(a)return a.noTime||!(a.to||a.from)?nowHM():(a.to||a.from);return lastEnd(d)||nowHM();}
function lastEnd(d){for(var i=d.rows.length-1;i>=0;i--){var r=d.rows[i];if(r.to)return r.to;if(r.from)return r.from;}return d.shiftFrom||"";}

document.addEventListener("pointermove",function(e){
  var g=ui.drag; if(!g||e.pointerId!==g.pid)return;
  e.preventDefault();
  var list=document.getElementById("rows"); if(!list)return;
  var items=[].slice.call(list.children).filter(function(n){return n!==g.li&&n.hasAttribute("data-id");});
  var before=null;
  for(var i=0;i<items.length;i++){var b=items[i].getBoundingClientRect();if(e.clientY<b.top+b.height/2){before=items[i];break;}}
  if(before){if(g.li.nextSibling!==before)list.insertBefore(g.li,before);} else if(list.lastChild!==g.li) list.appendChild(g.li);
  var vh=window.innerHeight; if(e.clientY<120)window.scrollBy(0,-12); else if(e.clientY>vh-80)window.scrollBy(0,12);
},{passive:false});
function endDrag(e){
  var g=ui.drag; if(!g||e.pointerId!==g.pid)return;
  ui.drag=null; g.li.classList.remove("dragging");
  var d=day(), order=[].slice.call(document.getElementById("rows").children).filter(function(n){return n.hasAttribute("data-id");}).map(function(n){return n.getAttribute("data-id");});
  var before=d.rows.map(function(r){return r.id;}).join();
  var bArr=d.rows.map(function(r){return r.id;});
  d.rows.sort(function(a,b){return order.indexOf(a.id)-order.indexOf(b.id);});
  var aArr=d.rows.map(function(r){return r.id;}), first=-1; for(var q=0;q<aArr.length;q++){if(aArr[q]!==bArr[q]){first=q;break;}}
  if(first>=0)afterReorder(d,first); else render();
}

/* ---------- saving (the page itself is the shared record) ---------- */
function setSave(m){saveMsg=m;var el=document.getElementById("saveMsg");if(el)el.textContent=m;}
function queueSave(){
  if(standalone){try{localStorage.setItem("nd.offline",JSON.stringify(S));setSave("Uloženo v tomto prohlížeči");}catch(_){setSave("Neuloženo – stáhněte zálohu přes Menu");}return;}
  if(preview){setSave("Náhled – změny se neukládají");return;}
  if(!art&&!(WEB&&canEdit)){setSave("Neuloženo");return;}
  clearTimeout(saveTimer); setSave("Ukládám…");
  saveTimer=setTimeout(flush,900);
}
function buildDoc(){
  var json=JSON.stringify(S).replace(/</g,"\\u003c");
  var main=document.getElementById("main").textContent;
  var css=document.getElementById("css").textContent;
  var SC="</"+"script>";
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>\n'+
    '<title>Natáčecí den</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">\n'+
    '<style id="css">'+css+'</style>\n'+
    '<div id="app"><p style="padding:24px 0">Načítám program…</p></div>\n'+
    '<script type="application/json" id="state">'+json+SC+'\n'+
    '<script id="main">'+main+SC+'\n</body></html>';
}
function flush(){
  saveTimer=null;
  if(ui.sheet||ui.drag){saveTimer=setTimeout(flush,700);return;}
  ss(false,{dayId:ui.dayId,y:window.scrollY});
  S.savedAt=Date.now();
  (WEB?webSave():pushLive().then(function(){return art.publish(buildDoc());})).then(function(){setSave("Uloženo");upstreamRetried=false;},function(err){
    var c=err&&err.code;
    if(c==="conflict"){toast("Někdo uložil dřív – načítám aktuální program");}
    else if(c==="not_writer"||c==="not_granted"||c==="consent_required"||c==="not_declared"||c==="capability_disabled"||c==="capability_removed"){canEdit=false;setSave("");render();toast("Tento program můžete jen prohlížet");}
    else if(c==="rate_limited"){setSave("Ukládám…");saveTimer=setTimeout(flush,5000);}
    else if(!upstreamRetried){upstreamRetried=true;saveTimer=setTimeout(flush,1000+Math.random()*1500);}
    else {setSave("Neuloženo");toast("Uložení se nepovedlo. Zkuste další změnu za chvíli.");}
  });
}

var st=ss(true), remembered=ls("nd.day"); ui.showDone=ls("nd.showDone")==="1";
ui.dayId=S.days.length?viewerDay().id:null; lastSnap=snapS();

function connect(tries){
  var C=window.claude;
  if(!C||typeof C.use!=="function"){if(tries<20)setTimeout(function(){connect(tries+1);},150);else if(standalone)goStandalone();else{liveState="off";liveInd();}return;}
  Promise.all([C.use("artifact"),C.use("user"),C.use("downloads"),C.use("db"),C.use("assets").catch(function(){return null;})]).then(function(res){
    art=res[0]; var u=res[1]; dl=res[2]; var dbx=res[3]; assetsNs=res[4];
    var go=function(){startLive(dbx);};
    if(!art){go();return;}
    return (u?u.canEdit():Promise.resolve(false)).then(function(ok){canEdit=!!ok;render();go();mnInit();});
  });
}
/* ---------- live sync: the plan also lives in db doc live/plan, so signed-in viewers get changes in about a second ---------- */
var liveDb=null, liveDoc=null, liveState="", lastLive=0, liveWriting=null;
function pushLive(){
  if(!liveDoc||!canEdit)return Promise.resolve();
  var body={json:JSON.stringify(S),savedAt:S.savedAt||Date.now()};
  var w=(liveWriting||Promise.resolve()).then(function(){return liveDoc.set(body);}).then(function(){lastLive=Date.now();liveInd();},function(){});
  liveWriting=w; return w;
}
function applyLive(snap){
  if(!snap||!snap.exists){ if(canEdit&&S.savedAt){if(WEB)queueSave();else pushLive();} liveState="live"; liveInd(); return; }
  var d=snap.data()||{}, theirs=+d.savedAt||0, mine=+S.savedAt||0;
  liveState="live"; lastLive=Date.now();
  if(theirs>mine){
    if(canEdit&&(ui.sheet||ui.drag||saveTimer!=null||saveMsg==="Ukládám…")){liveInd();return;}
    try{var o=JSON.parse(d.json);if(o&&o.days&&o.days.length){var y=window.scrollY;S=o;migrate(S);lastSnap=snapS();clearTimeout(window.__offT);window.__offT=setTimeout(offlineDocs,2500);
      if(!ui.dayPicked||!S.days.some(function(x){return x.id===ui.dayId;}))ui.dayId=viewerDay().id;
      render();window.scrollTo(0,y);}}catch(_){}
  } else if(theirs<mine&&canEdit&&!snap.hasPendingWrites){if(WEB){if(saveTimer==null)queueSave();}else pushLive();}
  liveInd();
}
function startLive(db){
  liveDb=db; if(!db){liveState="off";liveInd();return;}
  try{liveDoc=db.doc("live/plan");}catch(_){liveState="off";liveInd();return;}
  liveState="wait"; liveInd();
  liveDoc.onSnapshot(applyLive,function(){liveState="off";liveInd();});
}
function liveInd(){
  var lm=document.querySelector(".s-clock .livemini"); if(lm&&lm.outerHTML!==liveMiniHTML()){var b=document.getElementById("bar");if(b&&!ui.drag)b.innerHTML=headerHTML(day());}
  var el=document.getElementById("liveInd"); if(!el)return;
  if(standalone){el.className="live";el.innerHTML="";return;}
  if(liveState==="poll"){el.className="live";el.title=liveErr||"";el.innerHTML='<i></i>Online'+(canEdit?' · změny se ukládají':' · obnovuje se každých 10 s');return;}
  if(liveState==="off"&&WEB){el.className="live stale";el.title=liveErr||"";el.innerHTML='<i></i>'+(canEdit?'Bez spojení s databází':'Bez připojení – zobrazuje se poslední uložený program')+(liveErr?' <small>('+esc(liveErr)+')</small>':'');return;}
  if(liveState==="live"){el.className="live";el.innerHTML='<i></i>Živě'+(canEdit?' · změny se posílají všem':' · aktualizuje se samo');}
  else if(liveState==="off"&&!canEdit){el.className="live stale";el.innerHTML=WEB?'<i></i>Bez připojení – zobrazuje se poslední uložený program':'<i></i>Pro živé aktualizace se přihlaste na claude.ai';}
  else if(liveState==="off"){el.className="live stale";el.innerHTML='<i></i>Živé posílání nedostupné';}
  else {el.className="live";el.innerHTML="";}
}
function poll(){
  if(liveState==="live"){toast("Program je aktuální – aktualizuje se samo");return;}
  if(WEB){webFetch();toast("Načítám aktuální program…");return;}
  toast("Obnovte celou stránku v prohlížeči (potáhněte dolů). Po přihlášení na claude.ai se bude obnovovat samo.");
}

function goStandalone(){
  if(!standalone)return;
  canEdit=true;
  try{var keep=localStorage.getItem("nd.offline");if(keep){var k=JSON.parse(keep);if(k&&k.days&&k.days.length){S=k;ui.dayId=S.days[0].id;}}}catch(_){}
  setSave("Offline kopie · ukládá se v tomto prohlížeči");render();
}

/* ---------- web version: Supabase (plan rows 'main' = everything, editors only; 'public' = current day for the crew) ---------- */
function stripDocs(o){o.scripts=[];o.slozky=[];(o.days||[]).forEach(function(d){(d.rows||[]).forEach(function(r){delete r.pages;delete r.pagesAuto;delete r.slozka;delete r.slozkaAuto;});});(o.obrazy||[]).forEach(function(x){delete x.sid;});}
function publicState(){
  var t=todayISO(), y=new Date(); y.setDate(y.getDate()-1); var yi=y.getFullYear()+"-"+pad(y.getMonth()+1)+"-"+pad(y.getDate());
  var ds=S.days.filter(function(d){return d.date&&d.date>=yi;}).sort(function(a,b){return a.date<b.date?-1:1;}).slice(0,3);
  if(!ds.length){var all=S.days.filter(function(d){return d.date;}).sort(function(a,b){return a.date<b.date?-1:1;});ds=all.slice(-1);}
  if(!ds.length)ds=S.days.slice(0,1);
  ds=ds.map(function(d){var c=JSON.parse(JSON.stringify(d));c.rows.forEach(function(r){if(r.type!=="shot")return;var de=rowDesc(r),lo=rowLoc(r);if(de)r.desc=de;if(lo)r.loc=lo;});return c;});
  return {project:S.project||"",plan:S.plan||null,cast:castList(),scripts:scripts(),slozky:docList("brk"),days:ds,savedAt:S.savedAt};
}
function cacheKey(){return "nd.cache."+liveRow;}
function cacheSave(){try{localStorage.setItem(cacheKey(),JSON.stringify(S));}catch(_){}}
function cacheLoad(){try{var o=JSON.parse(localStorage.getItem(cacheKey())||"null");if(o&&o.days&&o.days.length){S=o;migrate(S);lastSnap=snapS();if(!ui.dayPicked)ui.dayId=viewerDay().id;return true;}}catch(_){}return false;}
function webSave(){
  var now=S.savedAt||Date.now();
  return SB.from("plan").upsert([{id:"main",json:S,saved_at:now,updated_at:new Date().toISOString()},{id:"public",json:publicState(),saved_at:now,updated_at:new Date().toISOString()}]).then(function(r){
    if(r.error){var e=new Error(r.error.message);e.code=/row-level security|permission/i.test(r.error.message)?"not_writer":"upstream";throw e;}
    cacheSave(); lastLive=Date.now(); liveInd();
  });
}
function snapOf(rec){return {exists:!!rec,hasPendingWrites:false,data:function(){return {json:JSON.stringify(rec.json),savedAt:+rec.saved_at||0};}};}
var liveErr="", rtOk=false, pollT=null;
function webFetch(){
  return SB.from("plan").select("json,saved_at").eq("id",liveRow).maybeSingle().then(function(r){
    if(r.error){liveErr="čtení: "+r.error.message;liveState="off";liveInd();return;}
    if(!rtOk){liveState="poll";}
    applyLive(snapOf(r.data)); if(rtOk)liveState="live"; else liveState="poll"; liveInd(); if(r.data)cacheSave();
  },function(e){liveErr="síť: "+(e&&e.message||e);liveState="off";liveInd();});
}
/* realtime pushes changes instantly; if it is not available, the page asks for news every 10 s */
function startPoll(){if(pollT)return;pollT=setInterval(function(){if(document.visibilityState==="visible"&&!rtOk)webFetch();},10000);}
function webSubscribe(){
  var old=liveChan; liveChan=null; rtOk=false; if(old){try{SB.removeChannel(old);}catch(_){}}
  var ch=SB.channel("plan-"+liveRow+"-"+Date.now());
  liveChan=ch;
  ch.on("postgres_changes",{event:"*",schema:"public",table:"plan",filter:"id=eq."+liveRow},function(p){if(ch!==liveChan)return;if(p.new&&p.new.json){applyLive(snapOf(p.new));cacheSave();}})
    .subscribe(function(st,err){if(ch!==liveChan)return;
      if(st==="SUBSCRIBED"){rtOk=true;liveErr="";}
      else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED"){rtOk=false;liveErr="realtime: "+st+(err&&err.message?" – "+err.message:"");}
      webFetch();});
  webFetch(); startPoll();
}
function becomeEditor(user){
  sbUser=user; canEdit=true; liveRow="main"; ui.sheet=null; mnInit();
  assetsNs={upload:function(file){var id=(crypto.randomUUID?crypto.randomUUID():uid()+Date.now()).replace(/-/g,"");
    return SB.storage.from("docs").upload(id+".pdf",file,{contentType:"application/pdf",upsert:false}).then(function(r){if(r.error){var e=new Error(r.error.message);e.code="upload";throw e;}return {id:id};});}};
  cacheLoad(); render(); webSubscribe();
}
function checkEditor(user){
  if(!user)return Promise.resolve(false);
  return SB.rpc("is_editor").then(function(r){return !r.error&&r.data===true;},function(){return false;});
}
function webLogin(email,pass){
  if(!email||!pass){ui.sheet.err="Vyplňte e-mail i heslo.";render();return;}
  ui.sheet.email=email; ui.sheet.busy=true; ui.sheet.err=""; render();
  SB.auth.signInWithPassword({email:email,password:pass}).then(function(r){
    if(r.error){ui.sheet.busy=false;ui.sheet.err=/invalid/i.test(r.error.message)?"Nesprávný e-mail nebo heslo.":r.error.message;render();return;}
    return checkEditor(r.data.user).then(function(ok){
      if(!ok){SB.auth.signOut();ui.sheet.busy=false;ui.sheet.err="Tento účet nemá oprávnění upravovat program.";render();return;}
      becomeEditor(r.data.user); toast("Přihlášeno – můžete upravovat");
    });
  },function(e){ui.sheet.busy=false;ui.sheet.err="Přihlášení se nepovedlo: "+(e&&e.message||e);render();});
}
function webConnect(){
  if(!window.supabase||!window.supabase.createClient){cacheLoad();render();liveState="off";liveInd();return;}
  var isRecovery=/type=recovery/.test(location.hash||"");
  SB=window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  try{SB.auth.onAuthStateChange(function(ev){if(ev==="PASSWORD_RECOVERY"||(isRecovery&&ev==="SIGNED_IN")){isRecovery=false;setTimeout(function(){ui.sheet={kind:"newpass"};render();},300);}});}catch(_){}
  cacheLoad(); render();
  SB.auth.getSession().then(function(r){var u=r.data&&r.data.session&&r.data.session.user;
    return checkEditor(u).then(function(ok){if(ok)becomeEditor(u);else{liveRow="public";webSubscribe();if(/[?&]login\b/.test(location.search))act("login");}});
  },function(){webSubscribe();});
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&SB)webFetch();});
  window.addEventListener("online",function(){if(SB)webSubscribe();});
}
if("serviceWorker" in navigator&&WEB){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
if(standalone)goStandalone(); else if(WEB)webConnect(); else connect(0);
})();
